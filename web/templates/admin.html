<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ bank_name }} — Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-box { background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 36px; width: 380px; }
        h2 { color: #e94560; font-size: 20px; margin-bottom: 4px; }
        .subtitle { color: #888; font-size: 12px; margin-bottom: 24px; }
        label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; text-transform: uppercase; }
        input { width: 100%; padding: 10px 14px; background: #0f3460; border: 1px solid #1a4b8f; border-radius: 6px; color: white; font-size: 14px; margin-bottom: 16px; outline: none; }
        .btn { width: 100%; padding: 12px; background: #e94560; border: none; border-radius: 6px; color: white; font-size: 15px; cursor: pointer; font-weight: 600; }
        .error { background: rgba(233,69,96,0.15); border: 1px solid #e94560; border-radius: 6px; padding: 10px; color: #e94560; font-size: 13px; margin-bottom: 16px; }
        .badge { color: #888; font-size: 11px; text-align: center; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>⚠️ Admin Portal</h2>
        <div class="subtitle">{{ bank_name }} Internal Systems — Authorized Access Only</div>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/admin/login">
            <label>Admin Username</label>
            <input type="text" name="username" placeholder="admin@securebank.internal">
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••••">
            <button type="submit" class="btn">ACCESS SYSTEM</button>
        </form>
        <div class="badge">🔐 All access attempts are logged and monitored</div>
    </div>
</body>
</html>
